<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME Manager - Hệ thống Quản lý Thiết bị & Bảo trì</title>
    <!-- Ant Design CSS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.12.5/reset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.12.5/antd.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Layout Khung chính -->
        <div class="app-container" style="display: flex; height: 100vh;">
            <!-- Sidebar Menu -->
            <div style="width: 260px; background: #001529; color: #fff; padding: 20px;">
                <h2 style="color: #fff; text-align: center; margin-bottom: 30px;">ME MANAGER</h2>
                <ul id="nav-menu" style="list-style: none; padding: 0;">
                    <li style="padding: 12px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 5px; background: #1890ff;" onclick="loadModule('dashboard')">📊 Tổng quan Dashboard</li>
                    <li style="padding: 12px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 5px;" onclick="loadModule('equipment')">⚙️ Quản lý Thiết bị</li>
                    <li style="padding: 12px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 5px;" onclick="loadModule('maintenance')">🛠️ Lịch Bảo trì</li>
                </ul>
            </div>

            <!-- Main Content Area -->
            <div style="flex: 1; display: flex; flex-direction: column; background: #f0f2f5;">
                <!-- Header -->
                <div style="height: 64px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 1px 4px rgba(0,21,41,.08);">
                    <h3 id="module-title" style="margin: 0; color: #333;">Tổng quan Dashboard</h3>
                    <div>Xin chào, <b>Admin</b></div>
                </div>

                <!-- Dynamic Content Container -->
                <div id="main-content" style="padding: 24px; overflow-y: auto; flex: 1;">
                    <!-- Nội dung module sẽ được load động vào đây -->
                    <div style="background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                        <h2>Chào mừng đến với hệ thống ME Manager!</h2>
                        <p>Chọn một module ở menu bên trái để bắt đầu làm việc.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ant Design & React (nếu cần dùng component nâng cao) + Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- File Logic của ứng dụng -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
