  function renderMaterialReplacementCycles(summary, startDate, endDate) {
    var body = document.getElementById('tblBaoCaoChuKyBody');
    if (!body) return;
    body.innerHTML = '';
    if (!summary.validDateRange) {
      document.getElementById('pageInfoBaoCaoChuKy').textContent = '0 trong 0';
      renderPaginationControls('paginationBaoCaoChuKy', 1, 1, function() {});
      renderMaterialCycleKpis([]);
      return;
    }

    var requestById = {};
    (appData.yeuCau || []).forEach(function(request) {
      var requestId = String(request['ID'] == null ? '' : request['ID']).trim().replace(/\.0+$/, '');
      requestById[requestId] = request;
    });
    var eventsByMachineMaterial = {};
    (appData.yeuCauVT || []).forEach(function(item) {
      var replacementTime = getReplacementTimestamp(item['Ngày sử dụng']);
      if (!isFinite(replacementTime)) return;
      var requestId = String(item['Mã yêu cầu'] == null ? '' : item['Mã yêu cầu']).trim().replace(/\.0+$/, '');
      var request = requestById[requestId];
      var machineName = String(request ? request['Máy móc/thiết bị'] || '' : '').trim();
      var machineKey = normalizeMachineRuntimeKey(machineName);
      var materialCode = String(item['Mã vật tư'] || '').trim();
      if (!machineKey || !materialCode) return;

      var machineMaterialKey = JSON.stringify([machineKey, materialCode]);
      var eventKey = JSON.stringify([machineMaterialKey, replacementTime, requestId]);
      var events = eventsByMachineMaterial[machineMaterialKey] || (eventsByMachineMaterial[machineMaterialKey] = {});
      if (!events[eventKey]) {
        var material = getInventoryMaterial(materialCode);
        events[eventKey] = {
          eventKey: eventKey,
          machineMaterialKey: machineMaterialKey,
          machineName: machineName,
          materialCode: materialCode,
          materialName: material ? getInventoryValue(material, ['Tên vật tư', 'Tên hàng', 'Tên']) : '',
          unit: material ? getInventoryValue(material, ['ĐVT', 'Đơn vị tính', 'ĐVT chính', 'Đơn vị']) : '',
          replacementHours: getMaterialReplacementHours(material),
          replacementTime: replacementTime,
          requestId: requestId,
          quantity: 0
        };
      }
      events[eventKey].quantity += Number(item['Số lượng']) || 0;
    });

    var reportStart = getReplacementTimestamp(startDate + 'T00:00');
    var reportEnd = getReplacementTimestamp(endDate + 'T23:59:59') + 1000;
    var cycles = [];
    var cycleKpis = [];
    Object.keys(eventsByMachineMaterial).forEach(function(machineMaterialKey) {
      var events = Object.keys(eventsByMachineMaterial[machineMaterialKey]).map(function(key) { return eventsByMachineMaterial[machineMaterialKey][key]; })
        .sort(function(a, b) { return a.replacementTime - b.replacementTime; });
      var currentIndex = -1;
      events.forEach(function(event, index) {
        if (event.replacementTime < reportEnd) currentIndex = index;
      });
      if (currentIndex !== -1) {
        var currentEvent = events[currentIndex];
        var currentStartDate = normalizeRuntimeDate(new Date(currentEvent.replacementTime));
        var elapsedHours = sumMachineRuntimeHours(currentEvent.machineName, currentEvent.replacementTime, reportEnd, currentStartDate, endDate);
        cycleKpis.push({
          machineName: currentEvent.machineName,
          materialCode: currentEvent.materialCode,
          materialName: currentEvent.materialName,
          replacementTime: currentEvent.replacementTime,
          elapsedHours: elapsedHours,
          replacementHours: currentEvent.replacementHours
        });
      }
      events.forEach(function(event, index) {
        var eventDate = normalizeRuntimeDate(new Date(event.replacementTime));
        if (eventDate < startDate || eventDate > endDate) return;
        var nextEvent = events[index + 1] || null;
        var nextWithinPeriod = nextEvent && nextEvent.replacementTime < reportEnd;
        var cycleEnd = nextWithinPeriod ? nextEvent.replacementTime : reportEnd;
        var cycleReportStart = normalizeRuntimeDate(new Date(event.replacementTime));
        var cycleReportEnd = nextWithinPeriod ? normalizeRuntimeDate(new Date(nextEvent.replacementTime)) : endDate;
        var cycleHours = sumMachineRuntimeHours(event.machineName, event.replacementTime, cycleEnd, cycleReportStart, cycleReportEnd);
        var cycleProgress = getMaterialCycleProgress(cycleHours, event.replacementHours);
        cycles.push({
          machineName: event.machineName,
          materialCode: event.materialCode,
          materialName: event.materialName,
          unit: event.unit,
          replacementTime: event.replacementTime,
          requestId: event.requestId,
          quantity: event.quantity,
          nextReplacementTime: nextEvent ? nextEvent.replacementTime : null,
          cycleHours: cycleHours,
          replacementHours: event.replacementHours,
          cyclePercent: cycleProgress.percent,
          cycleStatus: nextWithinPeriod ? 'Đã thay tiếp' : cycleProgress.status
        });
      });
    });
    renderMaterialCycleKpis(cycleKpis);
    cycles.sort(function(a, b) {
      return a.machineName.localeCompare(b.machineName) || a.materialCode.localeCompare(b.materialCode) || a.replacementTime - b.replacementTime;
    });

    if (!cycles.length) {
      body.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-3">Không có lần thay vật tư trong kỳ.</td></tr>';
      document.getElementById('pageInfoBaoCaoChuKy').textContent = '0 trong 0';
      renderPaginationControls('paginationBaoCaoChuKy', 1, 1, function() {});
      applyMobileTableLabels('tblBaoCaoChuKy');
      return;
    }
    var totalPages = Math.ceil(cycles.length / pageSizeMaterialCycles) || 1;
    if (currentPageMaterialCycles > totalPages) currentPageMaterialCycles = totalPages;
    var startIndex = (currentPageMaterialCycles - 1) * pageSizeMaterialCycles;
    var pageCycles = cycles.slice(startIndex, startIndex + pageSizeMaterialCycles);
    pageCycles.forEach(function(cycle) {
      var replacementDate = new Date(cycle.replacementTime);
      var nextDate = cycle.nextReplacementTime ? new Date(cycle.nextReplacementTime) : null;
      var row = document.createElement('tr');
      [
        cycle.machineName,
        cycle.materialCode,
        cycle.materialName,
        cycle.unit,
        replacementDate.toLocaleString('vi-VN'),
        cycle.requestId,
        formatInventoryNumber(cycle.quantity),
        nextDate ? nextDate.toLocaleString('vi-VN') : '-',
        cycle.replacementHours === null
          ? Number(cycle.cycleHours).toFixed(2) + ' giờ'
          : Number(cycle.cycleHours).toFixed(2) + ' / ' + cycle.replacementHours.toFixed(2) + ' giờ' + (cycle.cyclePercent === null ? '' : ' (' + cycle.cyclePercent.toFixed(2) + '%)'),
        cycle.cycleStatus
      ].forEach(function(value) {
        var cell = document.createElement('td');
        cell.textContent = value == null ? '' : String(value);
        row.appendChild(cell);
      });
      body.appendChild(row);
    });
    document.getElementById('pageInfoBaoCaoChuKy').textContent = (startIndex + 1) + ' - ' + Math.min(startIndex + pageCycles.length, cycles.length) + ' trong ' + cycles.length;
    renderPaginationControls('paginationBaoCaoChuKy', currentPageMaterialCycles, totalPages, function(page) {
      currentPageMaterialCycles = page;
      renderMaterialReplacementCycles(summary, startDate, endDate);
    });
    applyMobileTableLabels('tblBaoCaoChuKy');
  }

  function resetYCPagingAndRender() { currentPageYC = 1; renderYeuCauTable(); }
  function changePageSizeYC(val) { pageSizeYC = normalizePageSize(val); currentPageYC = 1; renderYeuCauTable(); }

  function getFilteredYeuCauRows() {
    var search = document.getElementById('filterYCSearch').value.toLowerCase();
    var kv = document.getElementById('filterYCKhuVuc').value;
    var st = document.getElementById('filterYCTrangThai').value;

    var filtered = appData.yeuCau.filter(function(item) {
      var matchSearch = String(item['Mô tả yêu cầu']).toLowerCase().indexOf(search) !== -1 || 
                          String(item['Máy móc/thiết bị']).toLowerCase().indexOf(search) !== -1 ||
                          String(item['ID']).indexOf(search) !== -1;
      var matchKV = !kv || item['Khu vực'] === kv;
      var matchST = !st || item['Trạng thái'] === st;
      return matchSearch && matchKV && matchST;
    });

    filtered.sort(function(a, b) { return compareDynamicValues(a, b, sortStateYC.col, sortStateYC.dir); });
    return filtered;
  }

  function renderYeuCauTable() {
    var addRequestButton = document.getElementById('btnYeuCauAdd');
    if (addRequestButton) addRequestButton.classList.toggle('d-none', !can('YEU_CAU_ADD'));
    var filtered = getFilteredYeuCauRows();

    var totalItems = filtered.length;
    var totalPages = Math.ceil(totalItems / pageSizeYC) || 1;
    if (currentPageYC > totalPages) currentPageYC = totalPages;

    var startIndex = (currentPageYC - 1) * pageSizeYC;
    var endIndex = Math.min(startIndex + pageSizeYC, totalItems);
    var pageData = filtered.slice(startIndex, endIndex);

    var tbody = document.getElementById('tblYeuCauBody');
    tbody.innerHTML = '';

    if (pageData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-3">Không có yêu cầu phù hợp</td></tr>';
    } else {
      pageData.forEach(function(item) {
        var badgeClass = 'bg-secondary';
        if (item['Trạng thái'] === 'Chờ tiếp nhận') badgeClass = 'bg-warning text-dark';
        else if (item['Trạng thái'] === 'Đã tiếp nhận' || item['Trạng thái'] === 'Đang thực hiện') badgeClass = 'bg-info text-dark';
        else if (item['Trạng thái'] === 'Đã thực hiện') badgeClass = 'bg-success';
        else if (item['Trạng thái'] === 'Chờ xác nhận') badgeClass = 'bg-primary';
        else if (item['Trạng thái'] === 'Hoàn thành') badgeClass = 'bg-success';
        else if (item['Trạng thái'] === 'Đã hủy') badgeClass = 'bg-danger';

        tbody.innerHTML += '<tr oncontextmenu="showContextMenu(event, \'YEU_CAU\', \'' + item['ID'] + '\')">' +
          '<td class="text-center">' +
            '<button class="btn btn-sm btn-light border" onclick="toggleRowDropdown(this, event, \'YEU_CAU\', \'' + item['ID'] + '\')"><i class="fa-solid fa-ellipsis-vertical"></i></button>' +
          '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + item['Trạng thái'] + '</span></td>' +
          '<td class="small">' + (item['Ngày yêu cầu'] || '') + '</td>' +
          '<td><span class="badge bg-light text-dark border">' + entityLinkMarkup(formatLoaiYCDisplay(item['Loại yêu cầu']), 'LOAI_YC', item['Loại yêu cầu']) + '</span></td>' +
          '<td>' + entityLinkMarkup(item['Khu vực'] || '', 'KHU_VUC', item['Khu vực']) + '</td>' +
          '<td class="fw-medium">' + entityLinkMarkup(item['Máy móc/thiết bị'] || '', 'MMTB', item['Máy móc/thiết bị']) + '</td>' +
          '<td class="small">' + (item['Ngày yêu cầu hoàn thành'] || '-') + '</td>' +
          '<td>' + (item['Mô tả yêu cầu'] || '') + '</td>' +
          '<td>' + entityLinkMarkup(formatUserDisplay(item['Người yêu cầu']), 'USER', item['Người yêu cầu']) + '</td>' +
          '<td>' + entityLinkMarkup(formatUserDisplay(item['Người tiếp nhận']), 'USER', item['Người tiếp nhận']) + '</td>' +
          '<td class="fw-bold">#' + item['ID'] + '</td>' +
        '</tr>';
      });
    }

    document.getElementById('pageInfoYC').innerText = (startIndex + 1) + ' - ' + endIndex + ' trong ' + totalItems;
    applyMobileTableLabels('tblYeuCau');
    applyTableCellEllipsis('tblYeuCau');
    initResizableTableColumns('tblYeuCau');
    applyTableFreeze('tblYeuCau', pinnedCols.tblYeuCau + 1);
    renderPaginationControls('paginationControlsYC', currentPageYC, totalPages, function(page) {
      currentPageYC = page;
      renderYeuCauTable();
    });
  }

  function openModalYC(mode, id) {
    hideContextMenu();
    var form = document.querySelector('#modalYC form');
    form.reset();
    document.getElementById('ycId').value = (mode === 'EDIT' || mode === 'VIEW') ? id : '';
    resetFileSelection('ycFileInput', 'filePreviewAreaYC', 'fileInfoTextYC');
    document.getElementById('ycCurrentFileUrl').value = '';

    var isViewOnly = (mode === 'VIEW');
    document.getElementById('ycInputFields').classList.toggle('d-none', isViewOnly);
    document.getElementById('ycViewSection').classList.toggle('d-none', !isViewOnly);
    document.getElementById('ycUploadSection').classList.toggle('d-none', isViewOnly);
    document.querySelector('#modalYC .modal-dialog').classList.toggle('modal-xl', isViewOnly);
    document.querySelector('#modalYC .modal-dialog').classList.toggle('modal-lg', !isViewOnly);
    document.getElementById('ycLoai').disabled = isViewOnly;
    document.getElementById('ycKhuVuc').disabled = isViewOnly;
    document.getElementById('ycMMTB').disabled = isViewOnly;
    document.getElementById('ycMoTa').readOnly = isViewOnly;
    document.getElementById('ycNgayCanHoanThanh').disabled = isViewOnly;
    document.getElementById('ycFileInput').disabled = isViewOnly;

    var submitBtn = document.querySelector('#modalYC button[type="submit"]');
    if (submitBtn) {
      if (isViewOnly) submitBtn.classList.add('d-none');
      else submitBtn.classList.remove('d-none');
    }

    if (mode === 'ADD') {
      document.getElementById('modalYCTitle').innerText = 'Tạo Yêu Cầu Mới';
      document.getElementById('ycMoTa').value = '';
      document.getElementById('ycNgayCanHoanThanh').value = '';
    } else if (mode === 'EDIT' || mode === 'COPY' || mode === 'VIEW') {
      var item = appData.yeuCau.find(function(y) { return normalizeRecordId(y['ID']) === normalizeRecordId(id); });
      if (item) {
        if (mode === 'VIEW') document.getElementById('modalYCTitle').innerText = 'Chi Tiết Yêu Cầu #' + id + ' (' + item['Trạng thái'] + ')';
        else if (mode === 'EDIT') document.getElementById('modalYCTitle').innerText = 'Sửa Yêu Cầu #' + id;
        else document.getElementById('modalYCTitle').innerText = 'Sao Chép Yêu Cầu từ #' + id;

        document.getElementById('ycLoai').value = item['Loại yêu cầu'] || '';
        document.getElementById('ycKhuVuc').value = item['Khu vực'] || '';
        filterMMTBByKhuVucModal();
        document.getElementById('ycMMTB').value = item['Máy móc/thiết bị'] || '';
        document.getElementById('ycMoTa').value = item['Mô tả yêu cầu'] || '';
        document.getElementById('ycNgayCanHoanThanh').value = normalizeRuntimeDate(item['Ngày yêu cầu hoàn thành']) || '';

        var fileUrl = item['Hình ảnh yêu cầu'] || item['Hình ảnh'] || '';
        document.getElementById('ycCurrentFileUrl').value = fileUrl;
        if (isViewOnly) {
          var statusClass = item['Trạng thái'] === 'Hoàn thành' ? 'bg-success'
            : item['Trạng thái'] === 'Đã hủy' ? 'bg-danger'
              : item['Trạng thái'] === 'Chờ tiếp nhận' ? 'bg-warning text-dark'
                : item['Trạng thái'] === 'Chờ xác nhận' ? 'bg-primary' : 'bg-info text-dark';
          var statusBadge = document.getElementById('ycViewStatus');
          statusBadge.className = 'badge ' + statusClass;
          statusBadge.textContent = item['Trạng thái'] || 'Chưa xác định';
                document.getElementById('ycViewMachineDetail').innerHTML = entityLinkMarkup(item['Máy móc/thiết bị'] || '-', 'MMTB', item['Máy móc/thiết bị']);
          document.getElementById('ycViewType').textContent = formatLoaiYCDisplay(item['Loại yêu cầu']);
                document.getElementById('ycViewArea').innerHTML = entityLinkMarkup(item['Khu vực'] || '-', 'KHU_VUC', item['Khu vực']);
          document.getElementById('ycViewRequester').textContent = formatUserDisplay(item['Người yêu cầu']);
          document.getElementById('ycViewCreated').textContent = item['Ngày yêu cầu'] || '-';
          document.getElementById('ycViewDue').textContent = item['Ngày yêu cầu hoàn thành'] || '-';
          document.getElementById('ycViewAssignee').textContent = formatUserDisplay(item['Người tiếp nhận']);
          document.getElementById('ycViewAccepted').textContent = item['Ngày tiếp nhận'] || '-';
          document.getElementById('ycViewDescription').textContent = item['Mô tả yêu cầu'] || '-';
          document.getElementById('ycViewFiles').innerHTML = fileUrl
            ? formatMultiLinks(fileUrl, 'Tệp đính kèm')
            : '<span class="text-muted">Không có tệp đính kèm.</span>';
          renderYeuCauDetailActions(item);
          renderRequestHistory(id);
          bootstrap.Tab.getOrCreateInstance(document.getElementById('ycRepairHistoryTab')).show();
        }
        if (fileUrl) {
          document.getElementById('existingFilesYC').innerHTML = '<strong>File / Ảnh đã lưu:</strong><br>' + formatMultiLinks(fileUrl, 'Ảnh YC');
          document.getElementById('filePreviewAreaYC').classList.remove('d-none');
        } else if (isViewOnly) {
          document.getElementById('existingFilesYC').textContent = 'Không có tệp đính kèm.';
          document.getElementById('filePreviewAreaYC').classList.remove('d-none');
        }
      }
    }
    syncAllSearchableSelects();
    bsModalYC.show();
  }

  function renderYeuCauDetailActions(item) {
    var container = document.getElementById('ycViewActions');
    container.innerHTML = '';
    var id = String(item['ID']);
    var status = String(item['Trạng thái'] || '').trim();
    var actions = [];

    function add(label, icon, className, callback) {
      actions.push({ label: label, icon: icon, className: className, callback: callback });
    }

    if (can('YEU_CAU_COPY')) {
      add('Sao chép', 'fa-copy', 'btn-outline-secondary', function() { openModalYC('COPY', id); });
    }
    if (can('YEU_CAU_EDIT', item)) {
      add('Chỉnh sửa', 'fa-pen', 'btn-outline-primary', function() { openModalYC('EDIT', id); });
    }
    if (status === 'Chờ tiếp nhận') {
      if (can('YEU_CAU_TIEP_NHAN', item)) {
        add('Tiếp nhận xử lý', 'fa-hand', 'btn-warning', function() { openUpdateStatusModal(id, 'TIEP_NHAN'); });
      }
      if (can('YEU_CAU_HUY', item)) {
        add('Hủy yêu cầu', 'fa-ban', 'btn-outline-dark', function() { handleHuyYeuCau(id); });
      }
      if (can('YEU_CAU_DELETE', item)) {
        add('Xóa yêu cầu', 'fa-trash', 'btn-outline-danger', function() { handleDeleteYeuCau(id); });
      }
    } else if ((status === 'Đã tiếp nhận' || status === 'Đang thực hiện') && can('REPAIR_LOG_MANAGE')) {
      add('Tạo nhật ký sửa chữa', 'fa-screwdriver-wrench', 'btn-primary', function() { openRepairLogModal('ADD', '', id); });
    } else if (status === 'Đã thực hiện' && can('YEU_CAU_MARK_DONE', item)) {
      add('Đã thực hiện', 'fa-check', 'btn-success', function() { markYeuCauWorkDone(id); });
    } else if (status === 'Chờ xác nhận' && can('YEU_CAU_CONFIRM', item)) {
      add('Xác nhận hoàn thành', 'fa-check', 'btn-success', function() { confirmYeuCauCompletion(id); });
    }

    container.classList.toggle('d-none', actions.length === 0);
    actions.forEach(function(action) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn btn-sm ' + action.className;
      button.innerHTML = '<i class="fa-solid ' + action.icon + ' me-1"></i>' + escapeHtml(action.label);
      button.addEventListener('click', function() {
        var modal = document.getElementById('modalYC');
        modal.addEventListener('hidden.bs.modal', action.callback, { once: true });
        bsModalYC.hide();
      });
      container.appendChild(button);
    });
  }

  function renderRequestHistory(requestId) {
    var relatedLogs = (appData.yeuCauTH || []).filter(function(log) {
      return normalizeRecordId(log['Mã yêu cầu']) === normalizeRecordId(requestId);
    }).sort(function(a, b) {
      return String(b['Đến giờ'] || getRepairLogId(b)).localeCompare(String(a['Đến giờ'] || getRepairLogId(a)));
    });
    var logIds = relatedLogs.map(function(log) { return normalizeRecordId(getRepairLogId(log)); });
    var repairBody = document.getElementById('ycRepairHistoryBody');
    var materialBody = document.getElementById('ycMaterialHistoryBody');
    repairBody.innerHTML = '';
    materialBody.innerHTML = '';

    relatedLogs.forEach(function(log) {
      var row = document.createElement('tr');
      var actions = document.createElement('td');
      actions.className = 'text-nowrap text-center';
      var menuButton = document.createElement('button');
      menuButton.type = 'button';
      menuButton.className = 'btn btn-sm btn-light border';
      menuButton.title = 'Chức năng nhật ký';
      menuButton.setAttribute('aria-label', 'Chức năng nhật ký #' + getRepairLogId(log));
      menuButton.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
      menuButton.addEventListener('click', function(event) {
        toggleRowDropdown(menuButton, event, 'REPAIR_LOG', getRepairLogId(log));
      });
      actions.appendChild(menuButton);
      row.appendChild(actions);
      [
        getRepairLogId(log),
        log['Từ giờ'],
        log['Đến giờ'],
        formatLoaiYCDisplay(log['Loại công việc']),
        log['Công việc thực hiện'],
        log['Máy móc/thiết bị'],
        formatUserDisplay(log['Người thực hiện']),
        log['Trạng thái'] || 'Đang thực hiện'
      ].forEach(function(value) {
        var cell = document.createElement('td');
        cell.textContent = value == null || value === '' ? '-' : String(value);
        row.appendChild(cell);
      });
      repairBody.appendChild(row);
    });

    var materials = (appData.kho || []).filter(function(stock) {
      return logIds.indexOf(normalizeRecordId(stock['Mã yêu cầu'])) !== -1 && Number(stock['Số lượng']) < 0;
    }).sort(function(a, b) {
      return String(b['Ngày nhập xuất'] || '').localeCompare(String(a['Ngày nhập xuất'] || ''));
    });
    materials.forEach(function(stock) {
      var material = getInventoryMaterial(stock['Mã vật tư']);
      var row = document.createElement('tr');
      var actions = document.createElement('td');
      actions.className = 'text-nowrap text-center';
      var menuButton = document.createElement('button');
      menuButton.type = 'button';
      menuButton.className = 'btn btn-sm btn-light border';
      menuButton.title = 'Chức năng vật tư đã sử dụng';
      menuButton.setAttribute('aria-label', 'Chức năng vật tư đã sử dụng #' + (stock['ID KHO'] || stock.ID || ''));
      menuButton.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
      menuButton.addEventListener('click', function(event) {
        toggleRowDropdown(menuButton, event, 'KHO', stock['ID KHO'] || stock.ID);
      });
      actions.appendChild(menuButton);
      row.appendChild(actions);
      [
        stock['Mã yêu cầu'],
        stock['Ngày nhập xuất'],
        stock['Mã vật tư'],
        material ? getInventoryValue(material, ['Tên vật tư', 'Tên hàng', 'Tên']) : '',
        formatInventoryNumber(Math.abs(Number(stock['Số lượng']) || 0)),
        formatInventoryMoney(stock['Đơn giá'])
      ].forEach(function(value) {
        var cell = document.createElement('td');
        cell.textContent = value == null || value === '' ? '-' : String(value);
        row.appendChild(cell);
      });
      materialBody.appendChild(row);
    });

    document.getElementById('ycRepairHistoryCount').textContent = String(relatedLogs.length);
    document.getElementById('ycMaterialHistoryCount').textContent = String(materials.length);
    document.getElementById('ycRepairHistoryEmpty').classList.toggle('d-none', relatedLogs.length > 0);
    document.getElementById('ycMaterialHistoryEmpty').classList.toggle('d-none', materials.length > 0);
  }

  function filterMMTBByKhuVucModal() {
    var selectedKV = document.getElementById('ycKhuVuc').value;
    var mmtbSelect = document.getElementById('ycMMTB');
    mmtbSelect.innerHTML = '<option value="">-- Chọn Máy móc/Thiết bị --</option>';

    var filtered = appData.mmtb.filter(function(m) {
      if (!selectedKV) return true;
      var kv = String(m['Khu vực'] || '').trim();
      var ma = String(m['Mã'] || '').trim();
      return kv === selectedKV || kv === 'Tất cả' || ma === 'KHAC';
    });

    filtered.forEach(function(m) {
      mmtbSelect.innerHTML += '<option value="' + m['Mã'] + '">' + m['Mã'] + ' - ' + m['Tên'] + '</option>';
    });
    syncAllSearchableSelects();
  }

  function handleSaveYeuCau(e) {
    e.preventDefault();
    var currentFileUrl = document.getElementById('ycCurrentFileUrl').value;
    var data = {
      id: document.getElementById('ycId').value,
      loaiYC: document.getElementById('ycLoai').value,
      khuVuc: document.getElementById('ycKhuVuc').value,
      mmtb: document.getElementById('ycMMTB').value,
      moTa: document.getElementById('ycMoTa').value,
      ngayYeuCauHoanThanh: document.getElementById('ycNgayCanHoanThanh').value,
      fileUrl: currentFileUrl
    };

    Swal.fire({ title: 'Đang lưu yêu cầu...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });

    uploadMultipleFiles('ycFileInput').then(function(newUrls) {
      if (newUrls.length > 0) {
        var newUrlsStr = newUrls.join(' | ');
        data.fileUrl = data.fileUrl ? (data.fileUrl + ' | ' + newUrlsStr) : newUrlsStr;
      }
      submitYeuCauData(data);
    }).catch(function(err) { Swal.fire('Lỗi upload', err.message || 'Không thể upload file!', 'error'); });
  }

  function submitYeuCauData(data) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          markReferenceCreateSaving('YEU_CAU');
          bsModalYC.hide();
          Swal.fire('Thành công', res.message, 'success');
          loadAllData(function() {
            if (!data.id && res.id) completeReferenceCreate('YEU_CAU', res.id);
          });
        } else { Swal.fire('Không có quyền', res.message, 'error'); }
      })
      .saveYeuCau(data, currentUser);
  }

  function handleDeleteYeuCau(id) {
    hideContextMenu();
    Swal.fire({ title: 'Xác nhận xóa?', text: 'Xóa Yêu cầu #' + id + '?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Xóa ngay' }).then(function(result) {

    for (var i = 0; i < candidates.length; i++) {
      if (item[candidates[i]] !== undefined && item[candidates[i]] !== null) return item[candidates[i]];
    }
    var keys = Object.keys(item || {});
    for (var j = 0; j < candidates.length; j++) {
      var candidate = String(candidates[j]).trim().toLowerCase();
      var matchingKey = keys.find(function(key) { return String(key).trim().toLowerCase() === candidate; });
      if (matchingKey !== undefined && item[matchingKey] !== undefined && item[matchingKey] !== null) return item[matchingKey];
    }
    return '';
  }

  function getLatestMachineMaterialReplacementDate(item) {
    var materialCode = normalizeMaterialCode(getInventoryValue(item, ['Mã vật tư', 'Mã VT', 'Mã hàng', 'Mã']));
    var machineCode = normalizeMachineRuntimeKey(getInventoryValue(item, ['Mã máy']));
    var matchingDates = (appData.kho || []).filter(function(stock) {
      return normalizeMaterialCode(getInventoryValue(stock, ['Mã vật tư', 'Mã VT', 'Mã hàng', 'Mã'])) === materialCode &&
        normalizeMachineRuntimeKey(getInventoryValue(stock, ['Mã máy móc/thiết bị', 'Máy móc/thiết bị'])) === machineCode &&
        Number(getInventoryValue(stock, ['Số lượng'])) < 0;
    }).map(function(stock) {
      return normalizeRuntimeDate(getInventoryValue(stock, ['Ngày nhập xuất']));
    }).filter(Boolean).sort();
    return matchingDates.length ? matchingDates[matchingDates.length - 1] : '';
  }

  function formatMachineReplacementDate(dateValue) {
    if (!dateValue) return '';
    var parts = dateValue.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function getMachineReplacementCycleInfo(item) {
    var replacementDate = getLatestMachineMaterialReplacementDate(item);
    if (!replacementDate) {
      return { date: '', hours: null, status: 'Chưa ghi nhận thay thế', badgeClass: 'bg-secondary' };
    }
    if (machineRuntimeError) {
      return { date: replacementDate, hours: null, status: 'Không tải được giờ chạy', badgeClass: 'bg-secondary' };
    }
    if (!machineRuntimeLoaded) {
      return { date: replacementDate, hours: null, status: 'Đang tải giờ chạy', badgeClass: 'bg-secondary' };
    }

    var frequencyText = String(getInventoryValue(item, ['Tần suất']) || '').trim().replace(',', '.');
    var frequency = Number(frequencyText);
    if (!isFinite(frequency) || frequency <= 0) {
      return { date: replacementDate, hours: null, status: 'Chưa khai báo tần suất', badgeClass: 'bg-secondary' };
    }
    var today = getLocalMachineRuntimeDate();
    var startTime = getReplacementTimestamp(replacementDate + 'T00:00:00');
    var elapsedHours = sumMachineRuntimeHours(
      getInventoryValue(item, ['Mã máy']),
      startTime,
      Date.now(),
      replacementDate,
      today
    );
    var percentage = elapsedHours / frequency * 100;
    if (percentage > 100) {
      return { date: replacementDate, hours: elapsedHours, status: 'Đã quá hạn thay thế', badgeClass: 'bg-danger' };
    }
    if (percentage < 90) {
      return { date: replacementDate, hours: elapsedHours, status: 'Chuẩn bị thay thế phụ tùng', badgeClass: 'bg-warning text-dark' };
    }
    return { date: replacementDate, hours: elapsedHours, status: 'Đang trong thời hạn', badgeClass: 'bg-success' };
  }

  function exportMMTBPrintTemplate() {
    var filteredItems = getFilteredMMTBRows();
    if (!filteredItems.length) {
      Swal.fire('Không có dữ liệu', 'Không có MMTB phù hợp với điều kiện lọc hiện tại.', 'info');
      return;
    }

    Swal.fire({ title: 'Đang tạo mẫu in...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          Swal.fire('Không thể tạo mẫu in', result && result.message ? result.message : 'Đã xảy ra lỗi khi tạo file.', 'error');
          return;
        }
        var binary = atob(result.base64);
        var bytes = new Uint8Array(binary.length);
        for (var index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
        var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = result.name || 'Danh_muc_MTTB.xlsx';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        Swal.fire('Đã tạo mẫu in', 'Đã xuất ' + filteredItems.length + ' thiết bị theo điều kiện lọc hiện tại.', 'success');
      })
      .withFailureHandler(function(error) {
        Swal.fire('Lỗi hệ thống', error && error.message ? error.message : 'Không thể tạo mẫu in.', 'error');
      })
      .createMMTBPrintFile(filteredItems);
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
    });
  }

  function createCategoryItem(contentHtml, type, id) {
    var item = document.createElement('li');
    item.className = 'list-group-item d-flex justify-content-between align-items-center gap-2';
    item.style.cursor = 'context-menu';
    item.addEventListener('contextmenu', function(event) { showContextMenu(event, type, id); });
    var content = document.createElement('div');
    content.className = 'min-w-0';
    content.innerHTML = contentHtml;
    item.appendChild(content);

    var permissionByType = { KHU_VUC: 'KHU_VUC_MANAGE', LOAI_YC: 'LOAI_YC_MANAGE', USER: 'USER_MANAGE' };
    if (can(permissionByType[type])) {
      var actions = document.createElement('div');
      actions.className = 'd-flex gap-1 flex-shrink-0';
      var menuButton = document.createElement('button');
      menuButton.type = 'button';
      menuButton.className = 'btn btn-sm btn-light border';
      menuButton.title = 'Chức năng';
      menuButton.setAttribute('aria-label', 'Chức năng ' + id);
      menuButton.innerHTML = '<i class="fa-solid fa-ellipsis-vertical"></i>';
      menuButton.addEventListener('click', function(event) { toggleRowDropdown(menuButton, event, type, id); });
      actions.appendChild(menuButton);
      item.appendChild(actions);
    }
    return item;
  }

  function openAdminForm(title, fields, onSave) {
    var fieldsHtml = fields.map(function(field) {
      var value = escapeHtml(field.value);
      var control;
      if (field.options) {
        control = '<select id="' + field.id + '" class="form-select">' + field.options.map(function(option) {
          var selected = option === field.value ? ' selected' : '';
          return '<option value="' + escapeHtml(option) + '"' + selected + '>' + escapeHtml(option) + '</option>';
        }).join('') + '</select>';
      } else {
        control = '<input id="' + field.id + '" type="' + (field.type || 'text') + '" class="form-control" value="' + value + '"' + (field.required ? ' required' : '') + (field.readonly ? ' readonly' : '') + '>';
      }
      return '<div class="text-start mb-3"><label class="form-label" for="' + field.id + '">' + escapeHtml(field.label) + '</label>' + control + '</div>';
    }).join('');

    return Swal.fire({
      title: title,
      html: fieldsHtml,
      showCancelButton: true,
      confirmButtonText: 'Lưu',
      cancelButtonText: 'Hủy',
      focusConfirm: false,
      preConfirm: function() {
        var values = {};
        for (var i = 0; i < fields.length; i++) {
          var field = fields[i];
          var value = document.getElementById(field.id).value.trim();
          if (field.required && !value) {
            Swal.showValidationMessage('Vui lòng nhập ' + field.label.toLowerCase() + '.');
            return false;
          }
          values[field.name] = value;
        }
        return values;
      }
    }).then(function(result) {
      if (result.isConfirmed) onSave(result.value);
    });
  }

  function runAdminMutation(method, data, successMessage) {
    Swal.fire({ title: 'Đang lưu...', allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          Swal.fire('Thành công', res.message || successMessage, 'success');
          var referenceType = method === 'khuVuc' ? 'KHU_VUC' : method === 'loaiYC' ? 'LOAI_YC' : '';
          loadAllData(function() {
            if (referenceType) completeReferenceCreate(referenceType, data.ma);
          });
        } else {
          var failedReferenceType = method === 'khuVuc' ? 'KHU_VUC' : method === 'loaiYC' ? 'LOAI_YC' : '';
          if (failedReferenceType && pendingReferenceCreate && pendingReferenceCreate.type === failedReferenceType) pendingReferenceCreate = null;
          Swal.fire('Không thể lưu', res && res.message ? res.message : 'Thao tác thất bại.', 'error');
        }
      })
      .withFailureHandler(function(error) {
        var failedReferenceType = method === 'khuVuc' ? 'KHU_VUC' : method === 'loaiYC' ? 'LOAI_YC' : '';
        if (failedReferenceType && pendingReferenceCreate && pendingReferenceCreate.type === failedReferenceType) pendingReferenceCreate = null;
        Swal.fire('Lỗi hệ thống', error && error.message ? error.message : 'Không gọi được máy chủ.', 'error');
      });

    if (method === 'khuVuc') runner.saveKhuVuc(data, currentUser);
    else if (method === 'loaiYC') runner.saveLoaiYC(data, currentUser);
    else runner.saveUser(data, currentUser);
  }

  function togglePushSetting(enabled) {
    if (!enabled) {
      saveBrowserNotificationSetting(false);
      return;
    }
    if (!('Notification' in window)) {
      document.getElementById('chkPushStatus').checked = false;
      Swal.fire('Không hỗ trợ', 'Trình duyệt này không hỗ trợ thông báo hệ thống.', 'warning');
      return;
    }
    if (Notification.permission === 'granted') {
      saveBrowserNotificationSetting(true);
      return;
    }
    if (Notification.permission === 'denied') {
      document.getElementById('chkPushStatus').checked = false;
      Swal.fire('Quyền bị chặn', 'Hãy cho phép thông báo cho trang trong cài đặt trình duyệt rồi thử lại.', 'warning');
      return;
    }

    try {
      Notification.requestPermission().then(function(permission) {
        if (permission === 'granted') saveBrowserNotificationSetting(true);
        else {
          document.getElementById('chkPushStatus').checked = false;
          Swal.fire('Chưa bật thông báo', 'Trình duyệt chưa cấp quyền thông báo cho trang này.', 'info');
        }
      }).catch(function() {
        document.getElementById('chkPushStatus').checked = false;
        Swal.fire('Không thể xin quyền', 'Mở ứng dụng trực tiếp trên trình duyệt và kiểm tra quyền thông báo của trang.', 'warning');
      });
    } catch (error) {
      document.getElementById('chkPushStatus').checked = false;
      Swal.fire('Không thể xin quyền', 'Mở ứng dụng trực tiếp trên trình duyệt và kiểm tra quyền thông báo của trang.', 'warning');
    }
  }

  function normalizeExcelValue(value) {
    if (value === null || value === undefined) return '';
    if (typeof value === 'object') return JSON.stringify(value);
    return value;
  }

  function appendExcelSheet(workbook, name, rows, headers) {
    var normalizedRows = rows.map(function(row) {
      var normalized = {};
      Object.keys(row).forEach(function(key) { normalized[key] = normalizeExcelValue(row[key]); });
      return normalized;
    });
    var worksheet = normalizedRows.length
      ? XLSX.utils.json_to_sheet(normalizedRows)
      : XLSX.utils.aoa_to_sheet([headers || []]);
    var columns = headers || (normalizedRows.length ? Object.keys(normalizedRows[0]) : []);
    worksheet['!cols'] = columns.map(function(key) { return { wch: Math.min(Math.max(String(key).length + 4, 12), 40) }; });
    XLSX.utils.book_append_sheet(workbook, worksheet, name);
  }

  function exportCurrentViewExcel() {
    if (!window.XLSX) {
      Swal.fire('Không thể xuất Excel', 'Thư viện Excel chưa tải được. Hãy tải lại trang rồi thử lại.', 'error');
      return;
    }

    var activePane = document.querySelector('.tab-pane:not(.d-none)');
    var activeId = activePane ? activePane.id : 'tab-dashboard';
    var workbook = XLSX.utils.book_new();
    var tabName = 'Dashboard';

    if (activeId === 'tab-yeucau') {
      if (!document.getElementById('request-view-types').classList.contains('d-none')) {
        tabName = 'LoaiYeuCau';
        appendExcelSheet(workbook, 'Loai yeu cau', appData.loaiYC, Object.keys(appData.loaiYC[0] || {}));
      } else {
        tabName = 'YeuCau';
        appendExcelSheet(workbook, 'Yeu cau', getYeuCauExportRows(getFilteredYeuCauRows()), ['ID', 'Trạng thái', 'Ngày yêu cầu', 'Loại yêu cầu', 'Khu vực', 'Máy móc/thiết bị', 'Ngày yêu cầu hoàn thành', 'Mô tả yêu cầu', 'Người yêu cầu', 'Người tiếp nhận']);
      }
    } else if (activeId === 'tab-yeucauth') {
      tabName = 'NhatKySuaChua';
      appendExcelSheet(workbook, 'Nhat ky sua chua', appData.yeuCauTH, ['ID TH', 'Từ giờ', 'Đến giờ', 'Loại công việc', 'Công việc thực hiện', 'Máy móc/thiết bị', 'Mã yêu cầu', 'Hình ảnh thực hiện', 'Người thực hiện', 'Trạng thái']);
    } else if (activeId === 'tab-mmtb') {
      if (!document.getElementById('machine-view-areas').classList.contains('d-none')) {
        tabName = 'KhuVuc';
        appendExcelSheet(workbook, 'Khu vuc', appData.khuVuc, Object.keys(appData.khuVuc[0] || {}));
      } else {
        tabName = 'MayMoc';
        appendExcelSheet(workbook, 'May moc', getMMTBExportRows(getFilteredMMTBRows()), ['Mã', 'Tên MMTB', 'Khu vực', 'ĐVT', 'Thông tin', 'Hồ sơ tài chính', 'Công suất (KW/H)', 'Hình ảnh', 'Tình trạng', 'Ngày đưa vào sử dụng', 'Thông số kỹ thuật', 'Người tạo', 'Ngày tạo', 'Ghi chú']);
      }
    } else if (activeId === 'tab-baocaosx') {
      tabName = 'BaoCaoSharePoint';
      var reportKeys = sharePointKeys;
      var reportRows = getFilteredBaoCaoRows().map(function(row) {
        var output = {};
        reportKeys.forEach(function(key) { output[key] = row[key]; });
        return output;
      });
      appendExcelSheet(workbook, 'Bao cao SX', reportRows, reportKeys);
    } else if (activeId === 'tab-danhmuc') {
      tabName = 'DanhMuc';
      appendExcelSheet(workbook, 'Nguoi dung', appData.user, Object.keys(appData.user[0] || {}));
    } else if (activeId === 'tab-kho' && !document.getElementById('inventory-view-ledger').classList.contains('d-none')) {
      tabName = 'SoKho';
      var stockRows = appData.kho.map(function(item) {
        return {
          'ID KHO': item['ID KHO'] || item.ID,
          'Ngày nhập xuất': item['Ngày nhập xuất'],
          'Mã vật tư': item['Mã vật tư'],
          'Số lượng': item['Số lượng'],
          'Đơn giá': item['Đơn giá'],
          'Giá trị': item['Giá trị xuất/nhập kho'] === '' || item['Giá trị xuất/nhập kho'] === null || item['Giá trị xuất/nhập kho'] === undefined
            ? Number(item['Số lượng'] || 0) * Number(item['Đơn giá'] || 0)
            : item['Giá trị xuất/nhập kho'],
          'Máy móc/TB': item['Mã máy móc/thiết bị'] || item['Máy móc/thiết bị'],
          'Ghi chú': item['Ghi chú'],
          'Người thực hiện': formatUserDisplay(item['Người thực hiện']),
          'Ngày thực hiện': item['Ngày thực hiện'],
          'Mã yêu cầu': item['Mã yêu cầu']
        };
      });
      appendExcelSheet(workbook, 'So kho', stockRows, ['ID KHO', 'Ngày nhập xuất', 'Mã vật tư', 'Số lượng', 'Đơn giá', 'Giá trị', 'Máy móc/TB', 'Ghi chú', 'Người thực hiện', 'Ngày thực hiện', 'Mã yêu cầu']);
    } else {
      appendExcelSheet(workbook, 'Yeu cau', getYeuCauExportRows(appData.yeuCau), ['ID', 'Trạng thái', 'Ngày yêu cầu', 'Loại yêu cầu', 'Khu vực', 'Máy móc/thiết bị', 'Ngày yêu cầu hoàn thành', 'Mô tả yêu cầu', 'Người yêu cầu', 'Người tiếp nhận']);
    }

    XLSX.writeFile(workbook, 'ME_Manager_' + tabName + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }

  function renderPaginationControls(containerId, currentPage, totalPages, onPageChange) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';

    var prevBtn = document.createElement('button');
    prevBtn.className = 'btn btn-outline-secondary' + (currentPage === 1 ? ' disabled' : '');
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prevBtn.onclick = function() { onPageChange(currentPage - 1); };
    container.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
        (function(page) {
          var btn = document.createElement('button');
          btn.className = 'btn ' + (page === currentPage ? 'btn-primary' : 'btn-outline-secondary');
          btn.innerText = page;
          btn.onclick = function() { onPageChange(page); };
          container.appendChild(btn);
        })(p);
      }
    }

    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-outline-secondary' + (currentPage === totalPages ? ' disabled' : '');
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    nextBtn.onclick = function() { onPageChange(currentPage + 1); };
    container.appendChild(nextBtn);
  }
